<!DOCTYPE html>
<html lang="en">

<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>Quote Galau</title>
   <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap">
   <style>
      body {
         font-family: "Courier new", "Playfair Display", serif;
         background-image: url(img/sunset2.jpg);
         background-repeat: no-repeat;
         background-size: cover;
         background-position: center;

      }

      h1 {
         font-size: 40px;
         font-style: italic;
         color: #5FA2E3;
         /* text-decoration: underline; */
         text-align: center;
         line-height: 2.2;
         letter-spacing: 10px;
         text-transform: uppercase;
         /* text-decoration: wavy underline 5px #61605f; */
         text-shadow: 3px 1px 0px rgba(0, 0, 30, 0.3);

      }

      p {
         font-family: "Courier new", monospace;
         font-size: 22px;
         color: #555;
         text-align: justify;
         line-height: 2;
         letter-spacing: 0.5px;
         text-align: center;
         font-weight: bold;


      }

      span {
         text-decoration: line-through;
         color: #919191;
      }

      .p2 {
         font-size: 10px;
         font-weight: normal;
         color: #7d7a7a;
      }
   </style>

</head>

<body>
   <h1>Fase Runtuh</h1>
   <p>
      "Tak perlu khawatir, ku hanya <span>terluka</span>. <br>
      terbiasa tuk pura-pura tertawa. <br>
      Namun bolehkah sekali saja aku menangis? <br>
      Sebelum kembali membohongi diri."
   </p>
   <p class="p2">- feby putri feat. Fiersa besari</p>

</body>

</html>
