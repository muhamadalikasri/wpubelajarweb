<!DOCTYPE html>
<html lang="en">

<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>form</title>
</head>

<body>
   <form action="" method="get">
      <table>
         <tr>
            <td colspan="2">
               <h1> Contoh Elemen-elemen form pada HTML</h1>
            </td>

         </tr>
         <tr>
            <td align="right"> <label for="name">Nama :

               </label></td>
            <td><input type="text" name="name" id="name" placeholder="Masukkan nama lengkap" autocomplete="off"
                  autofocus required></td>
         </tr>
         <tr>
            <td align="right"><label for="passworr"> Password :

               </label></td>
            <td><input type="password" name="password" id="password" placeholder="Masukkan password" autocomplete="off"
                  required></td>
         </tr>
         <tr>
            <td align="right"> <label for="email">Email :

               </label></td>
            <td> <input type="email" name="email" id="email" placeholder="Masukkan email aktif" autocomplete="off"
                  required></td>
         </tr>
         <tr>
            <td align="right"><label for="angka">Angka :

               </label></td>
            <td> <input type="number" name="angka" id="angka" placeholder="Masukkan angka" autocomplete="off" required
                  minlength="1" maxlength="100" step="5"></td>
         </tr>
         <tr>
            <td align="right"><label for="tanggal"> Tanggal :

               </label></td>
            <td><input type="date" name="tanggal" id="tanggal" required></td>
         </tr>
         <tr>
            <td align="right"><label for="warna">Pilih Warna :

               </label><label for="warna">Pilih Warna :

               </label></td>
            <td> <input type="color" name="warna" id="warna" required></td>
         </tr>
         <tr>
            <td align="right"> <input type="submit" value="Submit">
            </td>
            <td></td>
         </tr>

      </table>
   </form>

</body>

</html>
