<!DOCTYPE html>
<html lang="en">

<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>Quote Galau</title>
   <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap">
   <style>
      body {
         font-family: "Courier new", "Playfair Display", serif;
         background-image: url(img/sunset.jpg);
         background-repeat: no-repeat;
         background-size: cover;
         background-position: center;
         background-color: black;


      }

      h1 {
         font-size: 4em;
         font-style: italic;
         color: #5FA2E3;
         text-decoration: none;
         text-align: center;
         line-height: 1.2;
         letter-spacing: 10px;
         text-transform: uppercase;
         /* text-decoration: wavy underline 5px #61605f; */
         /* text-shadow: 0 0 5px #fff, 0 0 10px #fff, 0 0 30px #0091ff, 0 0 40px #0091ff; */
         background-image: linear-gradient(to right, rgb(34, 163, 255)20%, rgb(238, 80, 233));
         background-clip: text;
         color: transparent;
         filter: drop-shadow(0 0 15px lightgreen) drop-shadow(0 0 10px #fff) drop-shadow(0 0 30px #0091ff) drop-shadow(0 0 40px #0091ff);
      }


      p {
         font-family: "Courier new", monospace;
         font-size: 22px;
         color: #ffffff;
         text-align: justify;
         line-height: 2;
         letter-spacing: 0.5px;
         text-align: center;
         font-weight: bold;


      }

      span {
         /* text-decoration: line-through; */
         color: crimson;
         text-shadow: 0 0 30px rgb(220 20 60/20%);
         text-decoration: none;
      }

      .p2 {
         font-size: 10px;
         text-transform: uppercase;
         letter-spacing: 4px;
         /* text-decoration: overline; */
         color: #ffffff;
         /* text-decoration-line: overline; */
         text-decoration-thickness: 0.2px;
         border-top: 1px solid #fff;
         width: 30%;
         margin: 30px auto;
         padding-top: 20px;

      }

      .quote {
         background-color: rgba(0, 0, 0, 0.5);
         line-height: 2.2;
         border-radius: 20px;
         padding: 40px;
         word-spacing: 5px;
         margin: auto;
         max-width: 700px;
         border: 1px solid #fff;
         box-shadow: 0 10px 30px rgb(0, 0, 0);
      }
   </style>

</head>

<body>
   <h1>Fase Runtuh</h1>
   <p class="quote">
      "Tak perlu khawatir, ku hanya <span>terluka</span>. <br>
      terbiasa tuk pura-pura tertawa. <br>
      Namun bolehkah sekali saja aku menangis? <br>
      Sebelum kembali membohongi diri."
   </p>
   <p class="p2">- feby putri feat. Fiersa besari</p>

</body>

</html>
