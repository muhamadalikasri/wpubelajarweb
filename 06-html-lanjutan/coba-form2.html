<!DOCTYPE html>
<html lang="en">

<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>FORM INPUT2</title>
</head>

<body>
   <form action="" method="get">
      <h1> Contoh Input Atribut, Checkbox, dan Radio </h1>
      <label for="name">Name :
         <input type="text" id="name" name="name" placeholder="Masukkan nama" autocomplete="off" required autofocus>
      </label>
      <br>
      <label for="hobi">
         <h3>Hobby :</h3>
         <input type="checkbox" id="hobi" name="hobi" checked> Olahraga
         <br>
         <input type="checkbox" name="hobi1" id="hobi1"> Musik
      </label>
      <br>
      <h3>Jenis Kelamin :</h3>
      <label for="pria">
         <input type="radio" name="jenisKelamin" id="pria" value="pria">Pria
      </label>
      <label for="wanita">
         <input type="radio" name="jenisKelamin" id="wanita" value="wanita">Wanita
      </label>
      <br>
      <input type="submit" value="Kirim">
   </form>
</body>

</html>
