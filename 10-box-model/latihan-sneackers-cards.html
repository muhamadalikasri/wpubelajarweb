<!DOCTYPE html>
<html lang="en">

<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>latihan-sneackers-cards</title>
   <style>
      body {
         margin: 0;
         padding: 0;
         box-sizing: border-box;
         font-family: Arial, Helvetica, sans-serif;
         background-color: rgb(138, 138, 138);

      }

      section {
         /* justify-content: center; */
         margin: 20px 120px;
         border: 1px solid black;
         background-color: rgb(255, 255, 255);
         border-radius: 15px;

      }

      .bx-card {
         margin: 10px;
         /* border: 1px solid black; */
      }

      .bx-card img {
         display: block;
         width: 100%;
         /* height: 500px; */
         border-radius: 15px;
         margin: auto;
      }

      h4 {
         font-weight: bold;

      }

      .nike {
         color: rgb(0, 140, 255);
         font-weight: bold;
         font-size: 12px;
      }

      p:nth-child(4) {
         color: grey;
         font-size: 14px;
         line-height: 1.5;
      }

      p:nth-child(5) {
         font-size: 16px;
         font-family: "arial black";
      }

      span {
         text-decoration: line-through;
         color: gray;
         font-size: 10px;
      }

      .ukuranSepatu {
         margin: 10px;
         display: flex;
         /* border: 1px solid black; */
         justify-content: center;
         gap: 1px;
      }

      .piluk {
         margin: 10px;
         font-size: 10px;
         font-weight: bold;
         color: rgb(124, 124, 124);
      }

      .card {
         border: 1px solid rgb(129, 129, 129);
         border-radius: 10px;
         padding: 15px;
      }

      .card9 {
         background-color: black;
         color: white;
      }

      .tambker {
         margin: 10px;
         border: 1px solid black;
         border-radius: 5px;
         padding: 15px;
         background-color: black;
         color: white;
         font-size: 16px;
         text-align: center;
         text-transform: uppercase;
         letter-spacing: 2px;
      }
   </style>

</head>

<body>
   <section>

      <div class="bx-card"> <img src="sneakerscowo.jfif" alt=" gambar sepatu sneakers pria">
         <p class="nike">
            NIKE SPORTSWEAR
         </p>
         <h3>
            Air Max Essenstial
         </h3>
         <p>
            Kombinasi sempurna antara gaya retro dan kenyamanan modern. Dilengkapi dengan teknologi Air-Sole untuk
            bantalan
            yang responsif setiap hari.
         </p>
         <p>
            Rp.1,899,000 <span>Rp 2,299,000</span>

         </p>
      </div>
      <p class="piluk">Pilih Ukuran (US):</p>
      <div class="ukuranSepatu">

         <div class="card">
            8
         </div>
         <div class="card card9">
            9
         </div>
         <div class="card">
            10
         </div>
         <div class="card">
            11
         </div>
         <div class="card">
            12
         </div>
      </div>
      <div class="tambker">
         Tambahkan ke <br>Keranjang
      </div>
   </section>


</body>

</html>
