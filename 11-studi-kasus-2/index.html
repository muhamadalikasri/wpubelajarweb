   <!--  2. pembuka profile card -->
   <main>
      <div class="card-profile">
         <figure>
            <img src="assets/images/artisIndian.png" alt="artis india" class="imgCardprofile">
            <figcaption>
               <p>
                  Amir Khan adalah seorang musisi indie asal Indonesia yang dikenal dengan gaya musiknya yang unik dan
                  menarik. Ia menggabungkan berbagai genre musik, seperti indie rock, pop, dan elektronik, untuk
                  menciptakan suara yang khas dan menarik. Dengan inspirasi dari budaya dan kehidupan sehari-hari, Amir
                  Khan menciptakan lagu-lagu yang dapat menggugah emosi dan memicu refleksi.
               </p>
               <p>
                  Target utama dari Amir Khan adalah generasi Z, yang dikenal dengan minatnya yang kuat terhadap musik
                  indie dan budaya yang baru. Dengan menggunakan bahasa yang puitis dan mudah dimengerti, Amir Khan
                  dapat menyampaikan pesan-pesan yang relevan dan menarik bagi pendengarnya. Dengan karya-karyanya yang
                  kreatif dan semangatnya yang kuat, Amir Khan telah menjadi salah satu musisi indie Indonesia yang
                  paling populer di kalangan Gen Z.
               </p>
            </figcaption>
         </figure>
      </div>
   </main>
