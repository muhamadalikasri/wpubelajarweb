<!DOCTYPE html>
<html lang="en">

<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>coba warna background</title>
   <style>
      body {
         background-color: rgb(0, 120, 126);
         background-image: linear-gradient(130deg, lightgreen, lightblue);
         height: 100vh;
      }

      .kotak {
         width: 200px;
         height: 200px;
         background-color: blue;
         background-image: radial-gradient(red, black, grey);
      }

      .kotak1 {
         width: 200px;
         height: 200px;
         background-color: salmon;
      }

      .kotak2 {
         width: 200px;
         height: 200px;
         background-color: blue;
         background-image: conic-gradient(red, black, grey, yellow, red, black, grey, yellow);
      }
   </style>
</head>

<body>
   <div class="kotak1"> </div>
   <div class="kotak2"> </div>
   <div class="kotak"> </div>



</body>

</html>
