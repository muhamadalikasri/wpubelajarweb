<!DOCTYPE html>
<html lang="en">

<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>Quote Galau</title>
   <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap">
   <style>
      body {
         font-family: "Courier new", "Playfair Display", serif;
         background-image: url(img/sunset2.jpg);

      }

      h1 {
         font-size: 40px;
         font-style: italic;
         color: rgb(67, 187, 242);
         text-decoration: underline;
         text-align: center;
         line-height: 2.2;
         letter-spacing: 10px;
         text-transform: uppercase;
         text-decoration: wavy underline 5px rgb(35 44 62/80%);
         /* text-shadow: 5px 1px 0px rgb(250 250 250/20%); */
         background-clip: text;

         filter: drop-shadow();

      }

      p {
         font-family: "Courier new", monospace;
         font-size: 22px;
         color: rgb(233, 239, 250);
         text-align: justify;
         line-height: 2;
         letter-spacing: 0.5px;
         text-align: center;
         font-weight: bold;


      }

      span {
         text-decoration: line-through;
         color: rgb(170, 32, 66);
      }

      .p2 {
         font-size: 10px;
         font-weight: normal;
         color: rgb(125 122 122/60%);
      }
   </style>

</head>

<body>
   <h1>Fase Runtuh</h1>
   <p>
      "Tak perlu khawatir, ku hanya <span>terluka</span>. <br>
      terbiasa tuk pura-pura tertawa. <br>
      Namun bolehkah sekali saja aku menangis? <br>
      Sebelum kembali membohongi diri."
   </p>
   <p class="p2">- feby putri feat. Fiersa besari</p>

</body>

</html>
