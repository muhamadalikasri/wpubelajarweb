<!DOCTYPE html>
<html lang="en">

<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>Multiple Background</title>
   <style>
      body {
         min-height: 100vh;
         font-family: Arial, Helvetica, sans-serif;
         background-color: #333;
      }

      .frame {
         width: 450px;
         height: 450px;
         border: 10px solid #fff;
         margin: auto;
         background-image: url(img/ak.png), url(img/car.png), url(img/gel.png);
         background-repeat: no-repeat, no-repeat, no-repeat;
         background-position: center, center 40%, bottom left;
         background-size: 750px, 750px, 650px;
         background-color: #f0f0f0;
         border-radius: 50%;
      }

      h1 {
         text-align: center;
         color: #fff;
         font-family: "courier new" sans-serif;
         font-size: 40px;
         text-shadow: 5px 5px 0 black;

      }
   </style>
</head>

<body>
   <h1> My Profile Card</h1>
   <div class="frame">

   </div>
</body>

</html>
